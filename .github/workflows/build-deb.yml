name: Build and Release .deb

on:
  push:
    branches: [devel]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Upstream migrated npm -> pnpm (zextras#164): package-lock.json is gone,
      # pnpm-lock.yaml is the lockfile. Must run BEFORE setup-node, otherwise
      # cache: 'pnpm' cannot resolve the pnpm store path.
      # Version comes from "packageManager" in package.json (pnpm@10.32.1).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'      # package.json engines: node v22
          cache: 'pnpm'

      - name: Read version
        id: version
        run: |
          UPSTREAM=$(node -p "require('./package.json').version")
          VERSION="${UPSTREAM}+oidc${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb=carbonio-login-ui_${VERSION}_all.deb" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package .deb
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="carbonio-login-ui"
          DEB="${{ steps.version.outputs.deb }}"
          ROOT="$(mktemp -d)/${PKG}_${VERSION}_all"

          # Directory structure
          install -dm755 "${ROOT}/DEBIAN"
          install -dm755 "${ROOT}/opt/zextras/web/login"

          # Web assets from webpack build
          cp -a dist/. "${ROOT}/opt/zextras/web/login/"

          # Symlink: login/i18n -> /opt/zextras/web/login-i18n
          ln -s /opt/zextras/web/login-i18n \
            "${ROOT}/opt/zextras/web/login/i18n"

          # DEBIAN/control
          cat > "${ROOT}/DEBIAN/control" << EOF
          Package: ${PKG}
          Version: ${VERSION}
          Architecture: all
          Maintainer: Encedo Limited <support@encedo.com>
          Depends: carbonio-nginx, carbonio-webui-i18n
          Section: admin
          Priority: optional
          Homepage: https://github.com/encedo/carbonio-login-ui
          Description: Zextras Carbonio Login Page (Encedo OIDC fork)
           Fork of carbonio-login-ui adding a native OIDC SSO button to
           the Carbonio CE login form. Button is shown only when the
           carbonio-oidc-connector sidecar is running (/oidc/health).
          EOF

          # DEBIAN/preinst — remove old i18n dir if it exists (allows symlink)
          cat > "${ROOT}/DEBIAN/preinst" << 'PREINST'
          #!/bin/sh
          set -e
          if [ -d /opt/zextras/web/login/i18n ] && \
             [ ! -L /opt/zextras/web/login/i18n ]; then
            rm -rf /opt/zextras/web/login/i18n
          fi
          exit 0
          PREINST

          # DEBIAN/postinst — set ownership and permissions
          cat > "${ROOT}/DEBIAN/postinst" << 'POSTINST'
          #!/bin/sh
          set -e
          chown -R root:root /opt/zextras/web/login
          chmod -R 755 /opt/zextras/web/login
          find /opt/zextras/web/login/assets -maxdepth 1 -type f \
            -exec chmod 644 {} \; 2>/dev/null || true
          exit 0
          POSTINST

          chmod 755 "${ROOT}/DEBIAN/preinst" "${ROOT}/DEBIAN/postinst"

          # Strip leading whitespace from control file (heredoc indent)
          sed -i 's/^          //' "${ROOT}/DEBIAN/control"

          # Build
          dpkg-deb --build --root-owner-group "${ROOT}"
          mv "$(dirname "${ROOT}")/${PKG}_${VERSION}_all.deb" "${DEB}"

      - name: Sign .deb
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get install -y dpkg-sig

          # Import private key (no passphrase)
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

          dpkg-sig --sign builder \
            --gpg-options "--batch --yes" \
            "${{ steps.version.outputs.deb }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.deb }}
          path: ${{ steps.version.outputs.deb }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          body: |
            Built automatically from branch `devel` on push.

            **Install:**
            ```
            sudo dpkg -i ${{ steps.version.outputs.deb }}
            ```
            Replaces the stock `carbonio-login-ui` package.
            Requires [carbonio-oidc-connector](https://github.com/encedo/carbonio-oidc-connector) for the OIDC button to appear.

            **Verify signature:**
            ```
            ar x ${{ steps.version.outputs.deb }} && gpg --verify _gpgbuilder
            ```
          files: ${{ steps.version.outputs.deb }}
